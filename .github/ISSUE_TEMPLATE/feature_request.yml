name: Feature request
description: 提议新的功能或体验改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为和交互。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 是否考虑过其他做法？
  - type: textarea
    id: licensing
    attributes:
      label: 数据与许可
      description: 如果涉及数据、GIF 或模型，请说明来源和许可。
