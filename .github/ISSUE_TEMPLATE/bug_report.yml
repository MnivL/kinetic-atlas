name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先搜索现有 Issue，并确认问题能在最新 `main` 分支复现。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 选择……
        3. 查看……
    validations:
      required: true
  - type: input
    id: exercise
    attributes:
      label: 相关动作
      description: 如果涉及 GIF 或肌群映射，请提供动作名称。
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、浏览器、Node.js 版本和提交哈希。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请移除隐私信息后粘贴日志或截图。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我没有提交第三方 GIF 或模型文件。
          required: true
        - label: 这不是需要专业医疗判断的个人诊断请求。
          required: true
